<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agent Success Plan</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<meta name="description" content="Your Optimum Success Plan: a guided path for new agents, from your first setup to your income, your week, your leads, and how every call comes together.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --cream:#F5F1E8; --card:#FFFFFF; --fill:#FAF8F2; --rule:#E3DFD4; --rule-soft:#EDE9DF;
  --ink:#1B1B1B; --slate:#4A4A44; --muted:#8B8A82;
  --navy:#16203C; --navy-deep:#101832; --blue:#2C4A7C; --bluesoft:#EDF1F8;
  --gold:#C9A24E; --golddk:#A8853A; --goldsoft:#F4EBD5; --goldline:#E6D6AE;
  --green:#3F7A56; --greensoft:#EDF4EF; --rust:#A8452F; --rustsoft:#F8EEEB;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  --radius:12px; --radius-sm:8px; --radius-pill:999px;
  --shadow:0 1px 2px rgba(22,32,60,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--cream);color:var(--ink);font:16px/1.55 var(--sans);margin:0;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);color:var(--navy);font-weight:700;letter-spacing:-.015em;line-height:1.15;margin:0}

/* brand band (Optimum brand kit) */
.o-header{background:var(--navy);color:#fff;padding:13px 20px;display:flex;align-items:center;gap:14px}
.o-title{font-family:var(--serif);font-weight:700;font-size:20px;color:#fff;letter-spacing:-.01em;white-space:nowrap}
.o-sub{font-size:12px;font-weight:500;color:rgba(255,255,255,.62);margin-top:3px}
.o-sub .o-sep{color:rgba(255,255,255,.35);margin:0 4px}
.o-sub a{color:var(--gold);font-family:var(--serif);font-weight:700;font-size:13.5px;text-decoration:none}
.o-sub a:hover{color:#fff}
.o-pill{margin-left:auto;background:var(--gold);color:var(--navy);border:1px solid var(--gold);border-radius:var(--radius-pill);font-weight:700;font-size:12.5px;padding:8px 16px;text-decoration:none}
.o-pill:hover{background:var(--blue);border-color:var(--blue);color:#fff}
@media(max-width:640px){.o-header{flex-wrap:wrap}.o-pill{width:100%;text-align:center;margin:6px 0 0}}
.o-footer{font-size:12px;color:var(--muted);text-align:center;padding:8px 16px 28px;line-height:1.7}
.o-footer a{color:var(--golddk);font-weight:600;text-decoration:none}

/* floating bar: the route + every tool, always in reach */
.dock{position:sticky;top:0;z-index:50;background:rgba(245,241,232,.96);backdrop-filter:saturate(1.4) blur(6px);border-bottom:1px solid var(--rule)}
.dock-in{max-width:880px;margin:0 auto;padding:10px 16px 10px;display:grid;gap:9px}
.tools{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.tools::-webkit-scrollbar{display:none}
.tools .k{font-size:12px;font-weight:600;color:var(--muted);margin-right:2px}
.tools a{font-size:12.5px;font-weight:600;color:var(--navy);text-decoration:none;background:#fff;border:1px solid var(--rule);border-radius:999px;padding:5px 11px}
.tools a:hover{border-color:var(--navy)}
.tools a.goat{background:var(--gold);border-color:var(--gold)}
.rail{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--steps,10),minmax(0,1fr));gap:5px}
.rail button{width:100%;display:grid;gap:5px;justify-items:start;text-align:left;border:0;background:none;padding:0;cursor:pointer}
.rail button:disabled{cursor:not-allowed;opacity:.5}
.rail .bar{height:5px;width:100%;border-radius:99px;background:var(--rule)}
.rail .lbl{font:600 11.5px/1.2 var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rail .lbl span{font-family:var(--serif);font-weight:700;margin-right:3px}
.rail .done .bar{background:var(--green)}
.rail .cur .bar{background:var(--gold)}
.rail .cur .lbl{color:var(--navy)}
.rail li.gap{position:relative}
@media (max-width:700px){.rail .lbl b{display:none}}
@media (max-width:640px){.dock.tuck .tools{display:none}}

.wrap{max-width:880px;margin:0 auto;padding:18px 16px 0}
@media (prefers-reduced-motion:no-preference){.stage{animation:rise .3s ease both}}
@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}

.stage{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(20px,4vw,36px);display:grid;gap:22px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font:600 13px/1 var(--sans);color:var(--golddk)}
.eyebrow .t{font-weight:500;color:var(--slate);background:var(--fill);border:1px solid var(--rule);border-radius:6px;padding:4px 8px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.08;text-wrap:balance}
.lead{margin:0;font-size:17px;color:var(--slate);max-width:64ch}
h2{font-size:19px}
.block{display:grid;gap:12px}

.todo{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:t}
.todo li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;counter-increment:t}
.todo li::before{content:counter(t);font:700 26px/1 var(--serif);color:var(--gold);text-align:center}

.open{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;background:var(--navy);color:#fff;border-radius:var(--radius);padding:16px 18px}
.open p{margin:0;flex:1 1 240px;font-size:14.5px;color:rgba(255,255,255,.75)}
.open p b{display:block;font:700 18px/1.25 var(--serif);color:#fff;margin-bottom:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-sm);padding:12px 18px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
.btn-gold:hover{background:#fff;border-color:#fff}
.btn-main{background:var(--navy);color:#fff}
.btn-main:hover{background:var(--blue)}
.btn-main:disabled,.btn-main.locked{background:var(--rule);color:var(--muted)}
.btn-main:disabled{cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--navy);border-color:var(--rule)}
.btn-ghost:hover{border-color:var(--navy)}
.tip{margin:0;background:var(--goldsoft);border:1px solid var(--goldline);border-radius:var(--radius-sm);padding:12px 14px;font-size:15px}
.tip b{color:var(--golddk)}

/* how a call comes together */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.flow div{background:var(--fill);border:1px solid var(--rule);border-radius:var(--radius-sm);padding:12px;position:relative}
.flow div.on{background:var(--goldsoft);border-color:var(--gold)}
.flow b{display:block;font:700 15px/1.2 var(--serif);color:var(--navy)}
.flow span{font-size:13px;color:var(--slate);line-height:1.4;display:block;margin-top:3px}
.flow div:not(:last-child)::after{content:"→";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:var(--golddk);font-weight:700;z-index:1}
@media(max-width:600px){.flow{grid-template-columns:1fr 1fr}.flow div::after{display:none}}

/* plan numbers */
.calc{border:1px solid var(--rule);border-radius:var(--radius);padding:16px;display:grid;gap:14px;background:var(--fill)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.fld{display:grid;gap:5px}
.fld label{font-weight:600;font-size:14px}
.fld small{font-size:12.5px;color:var(--slate)}
.inbox{display:flex;align-items:center;border:1px solid var(--rule);border-radius:var(--radius-sm);background:#fff;padding:0 10px}
.inbox span{color:var(--muted)}
.inbox input{border:0;outline:0;padding:10px 4px;width:100%;background:transparent;font-variant-numeric:tabular-nums}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.num{background:#fff;border:1px solid var(--rule);border-radius:var(--radius-sm);padding:10px 12px;display:grid;gap:2px}
.num b{font:700 22px/1.1 var(--serif);color:var(--navy);font-variant-numeric:tabular-nums}
.num span{font-size:12.5px;color:var(--slate);font-weight:500}
.num.key{background:var(--navy);border-color:var(--navy)}
.num.key b{color:var(--gold)}.num.key span{color:rgba(255,255,255,.75)}
.fine{margin:0;font-size:13px;color:var(--slate)}
.need{margin:0;background:var(--bluesoft);border-radius:var(--radius-sm);padding:10px 12px;font-size:14.5px;color:var(--blue)}

/* lead tiers */
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:640px){.tiers{grid-template-columns:1fr}}
.tier{background:#fff;border:1px solid var(--rule);border-radius:var(--radius);padding:14px;display:grid;gap:8px;align-content:start}
.tier.goal{border:2px solid var(--gold);background:var(--goldsoft)}
.tier h3{font-size:17px}
.tier .big{font:700 26px/1 var(--serif);color:var(--navy);font-variant-numeric:tabular-nums}
.tier .big small{font:500 13px var(--sans);color:var(--slate)}
.tier ul{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:14px;color:var(--slate)}
.tier ul b{color:var(--ink);font-variant-numeric:tabular-nums}
.tier .why{font-size:13px;color:var(--slate);margin:0}

/* quick check */
.check{border-top:1px dashed var(--goldline);padding-top:22px;display:grid;gap:16px}
.q{border:0;margin:0;padding:0;display:grid;gap:10px}
.q legend{font:700 18px/1.3 var(--serif);color:var(--navy);padding:0;margin-bottom:10px;text-wrap:balance}
.opt{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:start;border:1px solid var(--rule);border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;background:#fff}
.opt:hover{border-color:var(--navy)}
.opt input{margin:3px 0 0;accent-color:var(--navy)}
.opt.right{border-color:var(--green);background:var(--greensoft)}
.opt.wrong{border-color:var(--rust);background:var(--rustsoft)}
.opt.chosen{border-color:var(--navy);background:var(--bluesoft)}
.fb{margin:0;font-size:14.5px;border-radius:var(--radius-sm);padding:10px 12px}
.fb.right{background:var(--greensoft);color:var(--green)}
.fb.soft{background:var(--goldsoft);color:var(--ink)}.fb.soft b{color:var(--golddk)}
.fb.wrong{background:var(--rustsoft);color:var(--rust)}
.q.nudge legend{color:var(--rust)}

.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list label{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;border:1px solid var(--rule);border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;background:#fff}
.list input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--green)}
.list label:has(input:checked){border-color:var(--green);background:var(--greensoft)}

.parts{display:grid;gap:14px}
.part h3{font-size:13px;font-family:var(--sans);font-weight:600;color:var(--golddk);margin-bottom:4px}
.path{list-style:none;margin:0;padding:0}
.path li{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule-soft)}
.path li:last-child{border-bottom:0}
.path .n{font:700 26px/1 var(--serif);color:var(--gold);text-align:center}
.path b{display:block;font:700 17px/1.25 var(--serif);color:var(--navy)}
.path small{color:var(--slate);font-size:14px}
.path .min{font-size:12px;color:var(--muted);white-space:nowrap}

.nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.nav .hint{font-size:14px;color:var(--slate);margin:0}
.nav .hint.warn{color:var(--rust);font-weight:600}

.stage.cover{margin-top:clamp(24px,8vh,80px);text-align:center;justify-items:center;padding-block:clamp(40px,9vw,80px);gap:16px}
.cover .kicker{font:600 13px/1 var(--sans);color:var(--golddk)}
.cover h1{font-size:clamp(36px,7vw,56px);max-width:15ch}
.cover .sub{margin:0;font-size:18px;color:var(--slate);max-width:44ch}
.cover .meta{margin:0;font-size:13px;color:var(--muted)}
.cover .btn{padding:14px 28px;font-size:16px}
.cover .rule{width:56px;height:3px;background:var(--gold);border-radius:2px}
.done-mark{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;background:var(--greensoft);color:var(--green)}
.rhythm{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.rhythm li{background:var(--fill);border:1px solid var(--rule);border-radius:999px;padding:7px 14px;font-weight:600;color:var(--navy);font-size:14.5px}
.toolwrap{border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--cream)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--navy);color:#fff;padding:10px 14px;font-size:13.5px}
.toolbar b{font-family:var(--serif);font-size:16px}
.toolbar a{color:var(--gold);font-weight:600;text-decoration:none;font-size:13px}
.toolframe{display:block;width:100%;border:0;min-height:560px;background:var(--cream)}
.live{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.live .num b{transition:color .3s}
.live .num.flash b{color:var(--green)}
.carried{margin:0;background:var(--greensoft);color:var(--green);border-radius:var(--radius-sm);padding:10px 12px;font-size:14.5px}
.tiers.two{grid-template-columns:repeat(2,minmax(0,1fr))}.tiers.one{grid-template-columns:minmax(0,420px)}
@media(max-width:640px){.tiers.two,.tiers.one{grid-template-columns:1fr}}
.tier.pick{font:inherit;text-align:left;cursor:pointer}.tier.pick:hover{border-color:var(--navy)}
.own{border-top:1px solid var(--rule);padding-top:10px}.own summary{cursor:pointer;font-weight:600;color:var(--navy);font-size:14px;margin-bottom:10px}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--radius-sm);background:#fff}
table.ramp{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:620px}
.ramp th{background:var(--navy);color:#fff;font-weight:600;font-size:12px;text-align:left;padding:8px 10px}
.ramp td{padding:8px 10px;border-top:1px solid var(--rule-soft);vertical-align:top}
.ramp td small{display:block;font-size:11.5px;color:var(--slate)}
.ramp td.you{color:var(--rust);font-weight:600}.ramp td.pos{color:var(--green);font-weight:700}
.why textarea{width:100%;border:1px solid var(--rule);border-radius:var(--radius-sm);padding:10px 12px;font:inherit;font-size:15.5px;line-height:1.5;background:#fff;resize:vertical}
.why textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.why label small{font-weight:500;color:var(--muted)}
.whycard{background:var(--navy);color:#fff;border-radius:var(--radius);padding:18px 20px;display:grid;gap:6px}
.whycard .k{font-size:12px;font-weight:600;color:var(--gold)}
.whycard p{margin:0;color:rgba(255,255,255,.82);font-size:15px}
.whycard p.main{font:600 20px/1.35 var(--serif);color:#fff}
.whycard b{color:var(--gold);font-weight:600}
.why input[type=text]{width:100%;border:1px solid var(--rule);border-radius:var(--radius-sm);padding:10px 12px;font-size:15.5px;background:#fff}
.why input[type=text]:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
/* poster: sized in em so one design scales from thumbnail to a full page */
.poster{font-size:10px;background:#fff;color:var(--ink);border:1px solid var(--rule);border-top:.8em solid var(--navy);padding:2.4em 2.8em 1.8em;display:grid;gap:1.5em;font-family:var(--sans);aspect-ratio:8.5/11;align-content:start;box-sizing:border-box}
.poster header{display:grid;gap:.4em;border-bottom:.25em solid var(--gold);padding-bottom:1.2em}
.poster .pk{font-size:1.2em;font-weight:600;color:var(--golddk)}
.poster h2{font:700 3.4em/1.05 var(--serif);color:var(--navy);margin:0}
.poster .pl{display:block;font-size:1.1em;font-weight:700;color:var(--golddk);margin-bottom:.4em}
.poster .pmain{font:600 2.1em/1.3 var(--serif);color:var(--navy);margin:0}
.poster .pwhy3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4em;margin-top:1.4em}
.poster .pwhy3 p{margin:0;font-size:1.3em;line-height:1.4;color:var(--slate)}
.poster .ph{color:var(--muted);font-style:italic;font-weight:400}
.poster .pmain,.poster .pwhy3 p{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}.poster .pmain{-webkit-line-clamp:5}.poster .pwhy3 p{-webkit-line-clamp:6}
.poster .pnums{display:grid;grid-template-columns:repeat(5,1fr);gap:.8em}
.poster .pt{background:var(--navy);border-radius:.6em;padding:1em .8em;display:grid;gap:.2em}
.poster .pt b{font:700 2em/1.1 var(--serif);color:var(--gold)}
.poster .pt span{font-size:1.05em;color:rgba(255,255,255,.8)}
.poster .prow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.8em}
.poster .prow div{border:1px solid var(--rule);border-radius:.6em;padding:.9em 1em;display:grid;gap:.15em;background:var(--fill)}
.poster .prow b{font:700 1.4em/1.2 var(--serif);color:var(--navy)}
.poster .prow span{font-size:1.1em;color:var(--slate)}
.poster .prhythm p{margin:0;font-size:1.35em;color:var(--navy);font-weight:600}
.poster footer{margin-top:auto;font-size:1em;color:var(--muted);border-top:1px solid var(--rule);padding-top:1em}
.walk-row{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.walk-row p{margin:0;color:var(--slate)}
.poster-mini{width:150px;overflow:hidden;pointer-events:none;box-shadow:var(--shadow-lift,0 10px 24px rgba(22,32,60,.12))}
.poster-mini .poster{font-size:3.4px;border-width:.5px}
.poster-screen{max-width:640px;width:100%;margin:0 auto;box-shadow:0 10px 24px rgba(22,32,60,.12)}
.poster-screen .poster{font-size:clamp(5px,1.55vw,10px)}
@media(max-width:480px){.walk-row{grid-template-columns:100px 1fr}.poster-mini{width:100px}.poster-mini .poster{font-size:2.3px}}
#printArea{display:none}
@media print{
  @page{size:letter;margin:.35in}
  body{background:#fff}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea .poster{font-size:11.2px;border:0;border-top:.8em solid var(--navy);height:10.2in;aspect-ratio:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.walk-ad{display:grid;grid-template-columns:120px 1fr;grid-template-areas:"img head" "img body";gap:4px 20px;align-items:center;background:var(--navy);color:#fff;border-radius:var(--radius);padding:18px 22px;border-left:5px solid var(--gold)}
.walk-ad .k{font-size:12px;font-weight:600;color:var(--gold)}
.walk-ad .big{font:700 22px/1.2 var(--serif);color:#fff;margin:4px 0 6px}
.walk-ad p{margin:0;color:rgba(255,255,255,.8);font-size:14.5px}
.walk-ad .poster-mini{grid-area:img;width:120px;transform:rotate(-3deg);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.walk-ad .poster-mini .poster{font-size:2.75px}
.walk-ad .wa-head{grid-area:head;align-self:end}.walk-ad .wa-body{grid-area:body;align-self:start}
@media(max-width:560px){.walk-ad{grid-template-columns:76px 1fr;grid-template-areas:"img head" "body body";gap:12px 14px;padding:14px 16px}.walk-ad .poster-mini{width:76px}.walk-ad .poster-mini .poster{font-size:1.75px}.walk-ad .big{font-size:18px}}
.ic{display:grid;gap:18px}
.ic-in{border:1px solid var(--rule);border-radius:var(--radius);padding:16px;background:var(--fill);display:grid;gap:10px}
.ic-in > label{font-weight:600}
.ic-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ic-money{width:180px}.ic-money input{font:700 22px var(--serif);color:var(--navy)}

function liveCommas(el){
  const before = el.value, caret = el.selectionStart ?? before.length;
  const digitsLeft = before.slice(0, caret).replace(/[^0-9.]/g,"").length;
  if(!/[0-9]/.test(before)) return;
  const after = commas(before); if(after === before) return;
  el.value = after;
  let n = 0, pos = 0; while(pos < after.length && n < digitsLeft){ if(/[0-9.]/.test(after[pos])) n++; pos++; }
  try{ el.setSelectionRange(pos, pos); }catch(e){}
}

/* ---------- plan maths ---------- */
const val = (k, d) => { const n = num(S.plan[k]); return n ?? d; };
function sz(){
  return {aP:val("aP",SZ.aP), aL:val("aL",SZ.aL), fP:val("fP",SZ.fP), fL:val("fL",SZ.fL),
          ct:val("ct",SZ.ct)/100, adv:val("adv",SZ.adv)/100, prem:val("prem",SZ.prem), roi:val("roi",SZ.roi), roi2:val("roi2",SZ.roi2)};
}
/* ---------- the Winning System, by return on lead spend ----------
   Every $1 of leads writes about $5 of annual premium (the deck: $500 a week -> $2,500 a week).
   Months 1-3 are always the deck's ramp: $500 aged, then +$500 fresh each month -> $10K, $20K, $30K.
   The month you hit your goal buys exactly what the goal needs; from month 4 on it assumes a 7x return,
   because three consistent months have sharpened your close. */
function buyFor(spend, z){
  const aged = Math.min(SZ.agedHold, spend), fresh = Math.max(0, spend - SZ.agedHold);
  return {aged, fresh, spend, leads: aged / z.aP + fresh / z.fP};
}
function monthRow(m, buy, ap, roi, z, goalMonth){
  return {m, ...buy, ap, roi, dep: ap * z.ct * z.adv, goalMonth};
}
function wsRamp(goal, z){
  const rows = [];
  for(let m = 1; m <= 4; m++){
    const roi = m <= 3 ? z.roi : z.roi2;
    if(m <= 3){
      const [a, f] = SZ.deck[m-1], deckAp = (a + f) * z.roi * SZ.wpm;
      if(deckAp < goal - 0.5){ rows.push(monthRow(m, buyFor(a + f, z), deckAp, roi, z, false)); continue; }
    }
    rows.push(monthRow(m, buyFor(goal / SZ.wpm / roi, z), goal, roi, z, true));
    break;
  }
  let cum = 0; rows.forEach(r => { cum += r.dep - r.spend * SZ.wpm; r.profit = cum; });
  return rows;
}
const MIXES = {aged:"All aged", fresh:"All fresh", mix:"Winning System mix"};
const mixKind = () => MIXES[S.plan.mix] ? S.plan.mix : "mix";
function straightPlan(goal, z, kind){
  kind = kind || mixKind();
  const spend = goal / SZ.wpm / z.roi;
  const buy = kind === "aged" ? {aged:spend, fresh:0, spend, leads:spend / z.aP}
            : kind === "fresh" ? {aged:0, fresh:spend, spend, leads:spend / z.fP} : buyFor(spend, z);
  const r = monthRow(1, buy, goal, z.roi, z, true);
  r.kind = kind; r.profit = r.dep - r.spend * SZ.wpm; return r;
}
const buyText = r => r.aged && r.fresh ? `${money(r.aged)} aged + ${money(r.fresh)} fresh` : r.fresh ? "all fresh" : "all aged";
/* the week you're working once you're at goal, on the chosen path */
function goalWeek(p){
  if(!p.ap) return null;
  const rows = S.plan.choice === "straight" ? [straightPlan(p.ap, p.z)] : wsRamp(p.ap, p.z);
  return rows[rows.length-1];
}
function planNumbers(){
  const ap = num(S.plan.ap), z = sz();
  const salesWk = ap ? ap / SZ.wpm / z.prem : null;
  return {ap, z, salesWk, goal:num(S.plan.goal)};
}
/* one week at a given spend: aged first (up to the hold), the rest fresh */
function week(aged, fresh, z){
  const aLeads = aged / z.aP, fLeads = fresh / z.fP;
  const sales = aLeads / z.aL + fLeads / z.fL;
  const ap = sales * z.prem;
  return {spend:aged+fresh, aged, fresh, leads:aLeads+fLeads, aLeads, fLeads, sales, pres:sales/SZ.close, ap, dep:ap*z.ct*z.adv};
}
/* the cheapest mix that hits a weekly sales target: aged up to the hold, then fresh */
function mixFor(sales, z){
  const agedMax = SZ.agedHold / z.aP / z.aL;
  const aged = sales <= agedMax ? sales * z.aL * z.aP : SZ.agedHold;
  const fresh = sales <= agedMax ? 0 : (sales - agedMax) * z.fL * z.fP;
  return week(Math.ceil(aged), Math.ceil(fresh/5)*5, z);
}
/* run weeks of spend; the business pays once its deposits cover the buy */
function runWeeks(spends, z){
  let bal = 0, oop = 0, spent = 0, dep = 0;
  return spends.map(([aged, fresh]) => {
    const w = week(aged, fresh, z);
    const fromBiz = Math.min(bal, w.spend), fromYou = w.spend - fromBiz;
    oop += fromYou; spent += w.spend; dep += w.dep; bal = bal - fromBiz + w.dep;
    return {...w, fromYou, oop, profit: dep - spent};
  });
}
function ramp(goalAP, z){
  const months = []; let fresh = 0;
  for(let m = 1; m <= 12; m++){
    const target = goalAP / SZ.wpm / z.prem;
    let f = fresh;
    const atGoal = week(SZ.agedHold, f, z).sales >= target - 1e-9;
    if(atGoal && m > 1){ const need = mixFor(target, z); f = need.fresh; }
    months.push({m, aged:SZ.agedHold, fresh:f});
    if(week(SZ.agedHold, f, z).sales >= target - 1e-9) break;
    fresh += SZ.step;
  }
  const weeks = runWeeks(months.flatMap(x => Array(SZ.wpm).fill([x.aged, x.fresh])), z);
  return months.map((x, i) => {
    const wk = weeks.slice(i*SZ.wpm, (i+1)*SZ.wpm), w0 = wk[0], last = wk[wk.length-1];
    return {...x, w:w0, apMonth: wk.reduce((a,b)=>a+b.ap,0), depMonth: wk.reduce((a,b)=>a+b.dep,0), oop:last.oop, profit:last.profit};
  });
}

/* ---------- compact income calculator ----------
   Runs the real Income Calculator's own maths in a hidden copy, so these numbers
   always match the full tool. It talks to window.IncomeAPI, the stable surface
   the calculator publishes for this page. Until that version is deployed, the
   same calls fall back to the calculator's older globals. */
let ENGINE = null;
function legacyEngine(w){
  const typesFor = p => p === "mix" ? {IUL:true, WholeLife:true, Term:true} : {IUL:p==="IUL", WholeLife:p==="WholeLife", Term:p==="Term"};
  const withInput = (input, fn) => { const st = w.state, keep = JSON.stringify(st);
    try{ if(input.goal != null) st.goal = +input.goal || 0; if(input.period) st.period = input.period; if(input.avgAP) st.avgAP = +input.avgAP;
         if(input.product) st.types = typesFor(input.product);
         ["wontPlace","leadPct","reservePct"].forEach(k => { if(input[k] != null) st[k] = input[k]; });
         return fn(st); } finally { Object.assign(st, JSON.parse(keep)); } };
  return {
    solve: input => withInput(input, () => w.solve()),
    takeHomeAt: (ap, input) => withInput(input, st => { const placed = ap * (1 - st.wontPlace), level = w.tierFor(placed);
      return {net: w.ADVANCE_PCT * placed * w.blendedRateAt(level) - st.leadPct * ap, level, placed}; }),
    bonus: v => w.producerBonus(v), nextLevel: v => w.nextTier(v), monthsLeftInYear: () => w.monthsLeftInYear(),
    defaults: {avgAP:1500, wontPlace:w.state.wontPlace, leadPct:w.state.leadPct, reservePct:w.state.reservePct, advancePct:w.ADVANCE_PCT},
    products: Object.entries(INC_TYPES).map(([key, label]) => ({key, label}))
  };
}
function bootEngine(){
  if(ENGINE || !TOOLS || !TOOLS.income) return;
  const f = document.createElement("iframe");
  f.hidden = true; f.setAttribute("aria-hidden","true");
  f.addEventListener("load", () => { try{ const w = f.contentWindow;
    ENGINE = w.IncomeAPI ? w.IncomeAPI : typeof w.solve === "function" ? legacyEngine(w) : null;
    if(ENGINE){ if(STEPS[S.cur]?.calc === "income") render(); else runIncome(); } }catch(e){} });
  f.srcdoc = new TextDecoder("utf-8").decode(Uint8Array.from(atob(TOOLS.income), c => c.charCodeAt(0)));
  document.body.appendChild(f);
}
const INC_TYPES = {WholeLife:"Whole life / final expense", IUL:"IUL", Term:"Term", mix:"A mix of all three"};
const incProducts = () => (ENGINE && ENGINE.products) || Object.entries(INC_TYPES).map(([key, label]) => ({key, label}));
const incLabel = k => (incProducts().find(p => p.key === k) || {label:k}).label;
const incState = () => ({goal:10000, period:"month", type:"WholeLife", avg:1500, unit:null, ...(S.inc||{})});
const incInput = () => { const i = incState(); return {goal:+i.goal || 0, period:i.period, product:i.type, avgAP:+i.avg || 1500}; };
function solveWith(over){
  const input = {...incInput(), ...(over||{})}, r = ENGINE.solve(input);
  r.avg = input.avgAP; return r;
}
/* take-home for a given monthly premium, using the engine's own ladder and rates */
function netAt(ap, over){ return ENGINE.takeHomeAt(ap, {...incInput(), ...(over||{})}); }
const RECRUITS = 3, OVERRIDE = 0.10;
function incomeCalcHTML(){
  const inc = incState();
  const seg = (v, l) => `<button type="button" data-period="${v}" aria-pressed="${inc.period===v}">${l}</button>`;
  return `<div class="ic">
    <div class="ic-in">
      <label for="incGoal">I want to take home</label>
      <div class="ic-row"><div class="inbox ic-money"><span>$</span><input id="incGoal" data-inc="goal" type="text" inputmode="numeric" value="${esc(commas(inc.goal))}"></div>
      <div class="seg" role="group" aria-label="Goal period">${seg("month","a month")}${seg("year","a year")}${seg("restofyear","rest of this year")}</div></div>
      <details class="own"><summary>What you sell and your average policy</summary><div class="fields">
        <div class="fld"><label for="incType">What you sell</label><select id="incType" data-inc="type">${incProducts().map(({key:k,label:l})=>`<option value="${k}"${inc.type===k?" selected":""}>${l}</option>`).join("")}</select></div>
        <div class="fld"><label for="incAvg">Average policy (annual premium)</label><div class="inbox"><span>$</span><input id="incAvg" data-inc="avg" type="text" inputmode="numeric" value="${esc(commas(inc.avg))}"></div></div>
      </div></details>
    </div>
    <div id="icOut"><p class="need">Loading the calculator…</p></div>
  </div>`;
}
function runIncome(){
  const el = $("#icOut"); if(!el) return;
  if(!ENGINE){ bootEngine(); return; }
  const inc = incState(), r = solveWith();
  if(!r.ap){ el.innerHTML = `<p class="need">Type the take-home you want above.</p>`; return; }
  const wk = 4.33, deals = r.ap / r.avg;
  /* carry forward */
  Object.assign(S.plan, {ap:Math.round(r.ap), prem:Math.round(r.avg), goal:Math.round(r.monthlyGoal), ppw:+(deals/wk).toFixed(1)}); save();
  const unit = inc.unit || (inc.period === "year" ? "year" : "month");
  const pol = {week:deals/wk, month:deals, year:deals*12}[unit];

/* ---------- compact activity planner ----------
   Same formulas and starting ratios as the Activity Planner (tools/activity-planner.html):
   dials per contact 50, contact to presentation 20%, close 25%, 20 s a dial,
   5 min a contact, 30 min a presentation, 60 min a sale, 6 days, 10 hours.
   Success Plan defaults (Jesse, 3 Oct): 2 weeks off, 1 hour of admin, 10-hour days, 15 s a dial. */
const ACT0 = {d2c:50, c2p:20, close:25, days:6, weeksOff:2, hours:10, admin:1, sec:15, mode:"phone", unit:"day"};
const actState = () => ({...ACT0, ...(S.act||{})});
function actRun(a, ap, prem){
  const weeks = 52 - a.weeksOff;
  const salesWk = ap * 12 / prem / weeks;
  const presWk = salesWk / (a.close/100), contWk = presWk / (a.c2p/100), dialWk = contWk * a.d2c;
  const per = d => ({week:d, day:d / a.days, month:d * weeks / 12, year:d * weeks});
  const mC = 5, mP = 30, mS = 60;   /* everyone sells by phone or Zoom */
  const day = {dials:dialWk/a.days, cont:contWk/a.days, pres:presWk/a.days, sales:salesWk/a.days};
  const talkMin = Math.max(0, day.cont - day.pres) * mC + Math.max(0, day.pres - day.sales) * mP + day.sales * mS;
  const dialMin = day.dials * a.sec / 60, adminMin = a.admin * 60;
  const needMin = talkMin + dialMin + adminMin, availMin = a.hours * 60;
  return {weeks, salesWk, dial:per(dialWk), cont:per(contWk), pres:per(presWk), sales:per(salesWk), day, talkMin, dialMin, adminMin, needMin, availMin};
}

const PLANNING_SRC = /(^|\.)ffloptimum\.com$/.test(location.hostname) ? "https://tools.ffloptimum.com/planning/" : "../site/planning/";

(function loadTools(){
  const f = document.createElement("iframe");
  f.hidden = true; f.setAttribute("aria-hidden","true"); f.src = PLANNING_SRC;
  f.addEventListener("load", () => { try{ TOOLS = f.contentWindow.TOOLS || null; }catch(e){ TOOLS = null; } if(TOOLS){ bootEngine(); render(); } });

})();

  ${s.flow!==undefined ? flowHTML(s.flow) : ""}
  <p class="lead">${s.lead}</p>
  ${s.todo ? `<div class="block"><h2>Do this</h2><ol class="todo">${s.todo.map(t=>`<li><span>${t}</span></li>`).join("")}</ol></div>` : ""}
  ${s.carried && S.plan.ap ? `<p class="carried"><b>Carried from step ${stepNo("income")}:</b> ${money(S.plan.ap)} a month in premium at a ${money(S.plan.prem||1500)} average. It's already in the planner below.</p>` : ""}
  ${s.embed ? embedHTML(s) : ""}
  ${s.preview ? storefrontHTML() : ""}
  ${s.shots ? `<div class="shots${s.shots.length>1?" two":""}">${s.shots.map(([img, cap, key])=>`<figure><a class="shot big" href="${LINKS[key]}" target="_blank" rel="noopener"><img src="img/${img}" alt="${cap}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`).join("")}</div>` : ""}
  ${s.points ? `<ul class="pts">${s.points.map(x=>`<li>${x}</li>`).join("")}</ul>` : ""}
  ${link && !s.toolAfter ? openBox(s, link) : ""}
  ${s.tool2 ? openBox({tool:s.tool2}, LINKS[s.tool2.link]).replace('class="open"','class="open alt"') : ""}
  ${s.live ? liveHTML() : ""}
  ${s.fields ? `<div class="block"><h2>Your numbers</h2><div class="calc"><div class="fields">${s.fields.map(fieldHTML).join("")}</div></div></div>` : ""}
  ${s.calc==="income" ? incomeCalcHTML() : ""}
  ${s.calc==="week" ? weekHTML() : ""}
  ${s.calc==="leads" ? `<div class="block"><h2>Your leads</h2>${leadsCalcHTML()}</div>` : ""}
  ${s.calc==="spend" ? `<div class="block"><h2>Your two paths</h2>${spendCalcHTML()}</div>` : ""}
  ${link && s.toolAfter ? openBox(s, link) : ""}
  ${s.tip ? `<p class="tip"><b>Tip:</b> ${s.tip}</p>` : ""}
  ${s.why ? whyHTML(s) : s.confirm ? confirmHTML(s) : quizHTML(s)}
  <div class="nav">
    <button class="btn btn-ghost" type="button" data-go="${i-1}">Back</button>
    <span class="hint" id="gateHint">${ok ? "" : remainingText(s)}</span>
    <button class="btn btn-main${ok?"":" locked"}" type="button" ${ok?`data-go="${i+1}"`:`data-gate="1"`}>${s.nextLabel || `Next: ${nxt.short}`}</button>
  </div>`;
}

function launchHTML(s, i){
  if(S.launched) return `
    <div class="done-mark" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="eyebrow">Launched</div>
    <h1>You're launched.</h1>
    <p class="lead">Here's your Success Plan. Print it and hang it where you make your calls.</p>
    <div class="poster-screen">${posterHTML()}</div>
    <div class="nav"><span class="hint">Prints on one letter page. Choose "Save as PDF" to keep a copy.</span><button class="btn btn-main" type="button" id="printPlan">Print my Success Plan</button></div>
    <p class="lead">From here it's rhythm. The agents who last run the same week, every week:</p>
    <ul class="rhythm"><li>Buy leads weekly</li><li>Work them daily</li><li>Run the Navigator</li><li>Place what fits</li><li>Follow up so it sticks</li></ul>
    <p class="tip"><b>Next:</b> come back to step ${stepNo("spend")} every week when you buy your leads, and to step ${stepNo("spend")} after 30 days to put in your own leads per sale.</p>
    <div class="nav"><button class="btn btn-ghost" type="button" data-go="-1">Back to the start</button><span><span class="copied" id="copied"></span> <button class="btn btn-ghost" type="button" id="copyPlan">Copy my plan</button> <button class="btn btn-ghost" type="button" id="unlaunch">Review my checklist</button></span></div>`;
  const all = s.checklist.every((_,k)=>S.checks.includes(k));
  return `
  <div class="eyebrow">Part ${PARTS[s.part].n} · ${PARTS[s.part].name}<span class="t">Step ${i+1} of ${STEPS.length} · about ${s.mins} min</span></div>
  <h1>${s.title}</h1>
  <p class="lead">${s.lead}</p>
  <p class="tip"><b>Almost there:</b> check off every item and your Success Plan unlocks to print.</p>
  <div class="block"><h2>Launch checklist</h2>
    <ul class="list">${s.checklist.map((c,k)=>`<li><label><input type="checkbox" data-k="${k}" ${S.checks.includes(k)?"checked":""}><span>${c}</span></label></li>`).join("")}</ul>
  </div>
  <div class="nav">
    <button class="btn btn-ghost" type="button" data-go="${i-1}">Back</button>
    <span class="hint">${all ? "" : `${S.checks.length} of ${s.checklist.length} done`}</span>
    <button class="btn btn-main" type="button" id="launchBtn" ${all?"":"disabled"}>I'm launched</button>
  </div>`;
}

let showCover = true;
function cover(){
  const total = STEPS.reduce((a,s)=>a+s.mins,0);
  const started = S.passed.length > 0 || S.cur >= 0;
  return `<span class="kicker">Start here</span>
  <h1>Your Optimum Success Plan</h1>
  <div class="rule"></div>
  <p class="sub">Let's get concrete on why you're in this business, the income you want, and the plan it takes to get there. We're in this together. By the end you'll have it all written down, so clear you can print your Success Plan and put it on the wall.</p>
  <button class="btn btn-main" type="button" id="coverGo">${started ? "Pick up where I left off" : "Create my plan"}</button>
  <p class="meta">About ${total} minutes · Works on your phone · Finish with a one-page plan for your wall</p>`;
}
function render(){
  const stg = $("#stage");
  $("#dock").hidden = showCover; $("#footRow").hidden = showCover;
  stg.classList.toggle("cover", showCover);
  if(showCover){ stg.innerHTML = cover(); return; }
  renderRail();
  stg.innerHTML = S.cur < 0 ? welcome() : stepHTML(S.cur);
  stg.style.animation = "none"; void stg.offsetWidth; stg.style.animation = "";
  runLeads(); runSpend(); paintLive(false); runIncome(); runWeek();
  const cur = STEPS[S.cur];
  if(!showCover && S.cur >= 0 && cur && cur.embed) mountTool(cur); else { clearInterval(sizer); clearInterval(reader); }
}

/* Redraw only the quick check and the step buttons, so an embedded tool
   keeps what the agent typed while they answer. */
function partialRender(){
  renderRail();
  const tmp = document.createElement("div"); tmp.innerHTML = stepHTML(S.cur);
  [":scope > .check", ":scope > .nav"].forEach(sel => {
    const a = $("#stage").querySelector(sel), b = tmp.querySelector(sel);
    if(a && b) a.replaceWith(b);
  });
}

/* ---------- events ---------- */
$("#stage").addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if(g && !g.disabled){ goStep(+g.dataset.go); return; }
  const gate = e.target.closest("[data-gate]");
  if(gate){
    const s = STEPS[S.cur];
    let target = null;
    if(s.quiz || s.quizFn){ const a = S.answers[s.id]||{}; const qi = qsOf(s).findIndex((q,k)=> !qPass(q, a[k])); target = document.querySelector(`.q[data-q="${qi}"]`); }
    else target = document.querySelector(".check");
    if(target){ target.scrollIntoView({behavior:"smooth", block:"center"}); target.classList.add("nudge"); setTimeout(()=>target.classList.remove("nudge"), 1200); }
    const h = $("#gateHint"); if(h){ h.textContent = remainingText(s); h.classList.add("warn"); }
    return;
  }
  if(e.target.closest("#coverGo")){ showCover = false; render(); window.scrollTo({top:0}); return; }
  if(e.target.id === "launchBtn"){ S.launched = true; save(); render(); window.scrollTo({top:0}); bigCelebrate(); }
  if(e.target.id === "unlaunch"){ S.launched = false; save(); render(); }
  const per = e.target.closest("[data-period]");
  if(per){ S.inc = {...incState(), period:per.dataset.period, unit:null}; save(); per.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(b===per))); runIncome(); return; }
  const md = e.target.closest("[data-mode]");
  if(md){ S.act = {...actState(), mode:md.dataset.mode}; save(); md.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(b===md))); runWeek(); return; }
  const au = e.target.closest("[data-aunit]");
  if(au){ S.act = {...actState(), unit:au.dataset.aunit}; save(); runWeek(); return; }
  if(e.target.id === "actReset"){ S.act = {}; save(); render(); return; }
  const un = e.target.closest("[data-unit]");
  if(un){ S.inc = {...incState(), unit:un.dataset.unit}; save(); runIncome(); return; }
  const fx = e.target.closest(".fixlink");
  if(fx){ e.preventDefault(); $("#fixit")?.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const mk = e.target.closest("[data-mix]");
  if(mk){ S.plan.mix = mk.dataset.mix; save(); runSpend(); return; }
  const pick = e.target.closest("[data-choice]");
  if(pick){ S.plan.choice = pick.dataset.choice; if(STEPS[S.cur]?.id === "spend"){ S.answers.spend = {...(S.answers.spend||{}), 0: pick.dataset.choice === "straight" ? 1 : 0}; refreshPassed(STEPS[S.cur]); } save(); runSpend(); partialRender(); return; }
  if(e.target.id === "printPlan"){ window.print(); return; }
  if(e.target.id === "copyPlan"){
    const t = planText(), c = $("#copied");
    const ok = () => { if(c) c.textContent = "Copied"; setTimeout(()=>{ if(c) c.textContent = ""; }, 2000); };
    try{ navigator.clipboard.writeText(t).then(ok, () => { prompt("Copy your plan:", t); }); }catch(err){ prompt("Copy your plan:", t); }
  }
});
$("#stage").addEventListener("input", e => {
  if(e.target.matches('input[inputmode="numeric"],input[inputmode="decimal"]')) liveCommas(e.target);
  const ak = e.target.dataset.act;
  if(ak){ const v = num(e.target.value); if(v != null){ S.act = {...actState(), [ak]: v}; save(); const o = $("#o-"+ak); if(o) o.textContent = v + (e.target.dataset.suffix||""); runWeek(); } return; }
  const ik = e.target.dataset.inc;
  if(ik){ S.inc = {...incState(), [ik]: ik==="type" ? e.target.value : (num(e.target.value) ?? "")}; save(); runIncome(); return; }
  const wk = e.target.dataset.why;
  if(wk){ S.why = {...(S.why||{}), [wk]: e.target.value}; const s = STEPS[S.cur]; refreshPassed(s); save(); partialRender(); return; }
  const k = e.target.dataset.plan; if(!k) return;
  S.plan[k] = e.target.value; save(); runLeads(); runSpend(); runWeek();
});
$("#stage").addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.inc){ const k = t.dataset.inc; S.inc = {...incState(), [k]: k==="type" ? t.value : (num(t.value) ?? "")}; save(); runIncome(); return; }
  if(t.type === "radio"){
    const s = STEPS[S.cur], qi = +t.closest(".q").dataset.q;
    S.answers[s.id] = {...(S.answers[s.id]||{}), [qi]: +t.value};
    if(s.id === "spend" && qi === 0){ S.plan.choice = +t.value === 1 ? "straight" : "scale"; runSpend(); }
    refreshPassed(s); save(); partialRender();
    document.querySelector(`.q[data-q="${qi}"] input:checked`)?.focus({preventScroll:true});
  }
  if(t.type === "checkbox" && t.dataset.confirm !== undefined){
    const s = STEPS[S.cur], k = +t.dataset.confirm, got = S.confirms[s.id] || [];
    S.confirms[s.id] = t.checked ? [...new Set([...got, k])] : got.filter(x => x !== k);
    refreshPassed(s); save(); partialRender();
  }
  else if(t.type === "checkbox" && t.dataset.k !== undefined){
    const k = +t.dataset.k;
    S.checks = t.checked ? [...new Set([...S.checks, k])] : S.checks.filter(x => x !== k);
    save(); render();
  }
});
$("#resetAll").addEventListener("click", () => { S = blank(); save(); showCover = true; render(); window.scrollTo({top:0}); });

/* Printing (button or Cmd+P) prints the Success Plan, once it's earned. */
addEventListener("beforeprint", () => { $("#printArea").innerHTML = S.launched ? posterHTML() : ""; });

/* Local preview only: when the file changes on disk, offer a reload so an open tab never shows an old version. */
if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){
  let stamp = null;
  setInterval(() => fetch(location.pathname, {method:"HEAD", cache:"no-store"}).then(r => {
    const m = r.headers.get("last-modified"); if(!m) return;
    if(stamp === null){ stamp = m; return; }
    if(m !== stamp && !$("#updBar")){
      const b = document.createElement("button"); b.id = "updBar"; b.type = "button";
      b.textContent = "This page was just updated. Click to reload.";
      b.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:999;background:#C9A24E;color:#16203C;border:0;border-radius:999px;padding:12px 22px;font:700 14px Inter,sans-serif;box-shadow:0 10px 24px rgba(22,32,60,.25);cursor:pointer";
      b.onclick = () => location.reload(); document.body.appendChild(b);
    }
  }).catch(()=>{}), 4000);
}

/* deep link: #step-3 opens step 3 if it's unlocked */
const m = /^#step-(\d)$/.exec(location.hash);
if(m){ showCover = false; const i = +m[1]-1; if(i>=0 && i<=unlockedUpTo()) S.cur = i; }
else if(location.hash === "#start"){ showCover = false; S.cur = -1; }
if(S.cur > unlockedUpTo()) S.cur = unlockedUpTo();
render();
</script>
<script data-goatcounter="https://ffloptimum.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
